{% extends "base.html" %}
{% block title %}新建生产订单 · 物料流转管理{% endblock %}
{% block nav %}
<a class="nav-link" href="/admin/orders">← 返回订单列表</a>
{% endblock %}
{% block content %}
<h2>新建生产订单</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/orders/create">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>订单号</label>
  <input name="orderNo" required style="max-width:240px" placeholder="字母/数字/-/_，如 PO-2601" value="{{ values.orderNo }}">
  <label>产品名</label>
  <input name="productName" required style="max-width:320px" value="{{ values.productName }}">
  <label>细分机型（1..20 项，留空行忽略）</label>
  <table style="max-width:680px">
    <tr><th>机型码</th><th>机型名</th><th>计划数量</th></tr>
    {% for i in range(1, 6) %}
    <tr>
      <td><input name="modelCode{{ i }}" value="{{ values['modelCode' ~ i] }}" style="max-width:150px"></td>
      <td><input name="modelName{{ i }}" value="{{ values['modelName' ~ i] }}" style="max-width:200px"></td>
      <td><input name="modelQty{{ i }}" type="number" min="1" value="{{ values['modelQty' ~ i] }}" style="max-width:100px"></td>
    </tr>
    {% endfor %}
  </table>
  <button type="submit">创建订单</button>
</form>
{% endblock %}
