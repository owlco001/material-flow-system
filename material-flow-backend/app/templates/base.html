<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}物料流转管理{% endblock %}</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1f2933; }
header { background: #1f2933; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
main { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.cards { display: flex; gap: 16px; flex-wrap: wrap; }
.cards .card { flex: 1 1 200px; }
label { display: block; margin: 12px 0 4px; }
input { padding: 8px; width: 100%; max-width: 320px; box-sizing: border-box; }
button { margin-top: 16px; padding: 8px 20px; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
.error { color: #b91c1c; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; background: #fff; }
th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; font-size: 14px; }
/* S16 移动端适配：表格横滚 + 小屏布局 + 触控目标 */
table { display: block; overflow-x: auto; white-space: nowrap; }
@media (max-width: 720px) {
  header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px 14px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  nav a { margin-right: 0 !important; }
  main { margin: 12px auto; padding: 0 10px; }
  th, td { padding: 6px 8px; font-size: 13px; }
  input, select, button { max-width: 100%; min-height: 40px; box-sizing: border-box; }
  .cards .card { flex: 1 1 100%; }
}
</style>
</head>
<body>
<header>
  <strong>物料流转 · 管理后台</strong>
  <nav>{% block nav %}{% endblock %}</nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
