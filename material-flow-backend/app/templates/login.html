{% extends "base.html" %}
{% block title %}登录 · 智慧工厂{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></svg></span>
      <h1>智慧工厂 · 管理后台</h1>
      <p>请使用管理员账号登录</p>
    </div>
    <div class="card">
      {% if error %}<p class="error">用户名或密码错误</p>{% endif %}
      <form method="post" action="/admin/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>用户名</label>
        <input name="username" autocomplete="username" required>
        <label>密码</label>
        <input name="password" type="password" autocomplete="current-password" required>
        <button type="submit">登 录</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
