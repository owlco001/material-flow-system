name: 后端测试

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "material-flow-backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "material-flow-backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: material-flow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: material-flow-backend/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -q
