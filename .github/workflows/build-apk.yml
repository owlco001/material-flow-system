name: 构建 Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "logistics-android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 Debug APK
        working-directory: logistics-android
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-factory-debug-apk
          path: logistics-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 构建 Release APK（仅标签）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: logistics-android
        run: ./gradlew :app:assembleRelease --stacktrace

      # 推 v* 标签时：按 app-{versionCode}-{versionName}.apk 命名并发布 GitHub Release
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: logistics-android
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$name" != "$TAG" ]; then echo "标签 $TAG 与 versionName $name 不一致"; exit 1; fi
          out="app-$code-$name.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" | tee "$out.sha256"
          notes="${RELEASE_NOTES:-$(git log -1 --pretty=%s)}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag
          gh release upload "$TAG" "$out" --clobber
