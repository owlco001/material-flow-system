name: 构建 Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "logistics-android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 Debug APK
        working-directory: logistics-android
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-factory-debug-apk
          path: logistics-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
