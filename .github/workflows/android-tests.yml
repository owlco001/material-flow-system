name: Android 单元测试

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "logistics-android/**"
      - ".github/workflows/android-tests.yml"
  push:
    branches: [main]
    paths:
      - "logistics-android/**"
      - ".github/workflows/android-tests.yml"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 单元测试
        working-directory: logistics-android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: logistics-android/app/build/reports/tests/
